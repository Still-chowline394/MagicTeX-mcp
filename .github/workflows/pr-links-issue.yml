name: PR links an issue

# GitHub can enforce "must go through a PR" and "must pass CI", but it has no
# native setting for "must open an issue first". This is that rule, as far as it
# can be automated: the PR body must close an issue, or explicitly claim one of
# the exemptions listed in CONTRIBUTING.md (typo / link / translation fixes).
#
# It's a check, not a wall — a repo admin can still merge past it when the
# exemption is obvious.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # Named explicitly rather than "check": this is a required status check in the
  # branch ruleset, and required checks are matched by this exact string.
  pr-links-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Look for a closing keyword or an exemption
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # The "open an issue first" rule is for human contributors. Bots
          # (Dependabot, CodeQL autofix) don't file issues and their PR bodies
          # are generated changelogs, so the check would always fail on them.
          # Skipped as a step, not a job-level `if:`, so the required status
          # check still reports success rather than "skipped".
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "✓ Bot-authored PR — issue requirement doesn't apply."
            exit 0
          fi

          # GitHub's own closing keywords, followed by #<number>.
          if grep -qiE '(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))[[:space:]]+#[0-9]+' <<< "$BODY"; then
            echo "✓ PR body closes an issue."
            exit 0
          fi

          if grep -qiE '^[[:space:]]*exempt:[[:space:]]*\S' <<< "$BODY"; then
            echo "✓ PR body claims an exemption."
            exit 0
          fi

          echo "::error::This PR doesn't reference an issue."
          echo ""
          echo "Add a closing reference to the PR description, e.g.:"
          echo "    Fixes #123"
          echo ""
          echo "Or, for a typo / broken link / translation fix, write:"
          echo "    exempt: typo in the user guide"
          echo ""
          echo "See CONTRIBUTING.md for why an issue comes first."
          exit 1
