name: Bug report
description: Something in MagicTeX doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if a LaTeX package just isn't in the bundled TeX Live
        subset, that's expected — see the package-coverage section of the
        [user guide](https://github.com/ZoeLinUTS/MagicTeX-mcp/blob/main/docs/USER-GUIDE.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ran /magic-latex on a project with…
        2. Selected text on page 2 and added a comment…
        3. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Compiling / the PDF preview
        - Comments and highlights
        - The source editor or Visual mode
        - History, checkpoints, or restore
        - MCP tools / slash commands
        - Export to Overleaf
        - Docs
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MagicTeX version
      description: "`npm ls magictex-mcp`, or the commit if running from a clone."
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: "Windows 11, Node 22.14"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >
        Compile errors, terminal output, or console errors from the workspace tab.
        Please don't paste your whole paper — a minimal snippet is more useful.
      render: shell
