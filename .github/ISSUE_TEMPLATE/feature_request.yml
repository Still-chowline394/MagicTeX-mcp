name: Feature request
description: Suggest something MagicTeX should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: the workspace UI has **no agent in it**.
        MCP tools run Claude→server only, so the browser can't make Claude do
        anything — "add a button that runs an AI review" can't work as stated.
        See [ARCHITECTURE.md](https://github.com/ZoeLinUTS/MagicTeX-mcp/blob/main/docs/ARCHITECTURE.md).

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: >
        Describe the situation you're stuck in, not the solution you have in mind.
        What were you trying to get done?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds, other tools, or why the current flow doesn't fit.

  - type: checkboxes
    id: help
    attributes:
      label: Would you be up for implementing it?
      options:
        - label: I'd be willing to open a PR for this (after we agree on the approach)
